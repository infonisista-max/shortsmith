<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortsmith</title>
<style>
  :root { color-scheme: light dark; --accent: #ffd60a; --muted: #777; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 420px; margin: 4rem auto; padding: 0 1rem; }
  h1 { font-size: 1.6rem; margin-bottom: .25rem; }
  .sub { color: var(--muted); margin-top: 0; }
  label { display: block; font-weight: 600; margin-top: .75rem; }
  input[type=password] { width: 100%; box-sizing: border-box; padding: .5rem; font: inherit; margin-bottom: 1rem; }
  .reject { background: #c0392b; color: #fff; padding: .75rem 1rem; border-radius: 8px; margin: 1rem 0; }
  button { font: inherit; font-weight: 700; padding: .75rem 1.5rem; border: 0; border-radius: 8px;
           background: var(--accent); color: #111; cursor: pointer; }
</style>
</head>
<body>
<h1>Shortsmith</h1>
<p class="sub">Enter the passcode to continue.</p>
$message
<form method="post" action="/passcode">
  <input type="hidden" name="next" value="$next">
  <label for="passcode">Passcode</label>
  <input id="passcode" name="passcode" type="password" autocomplete="current-password" autofocus required>
  <button type="submit">Enter</button>
</form>
</body>
</html>
