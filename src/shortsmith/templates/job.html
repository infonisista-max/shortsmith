<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job $job_id</title>
<style>
  :root { color-scheme: light dark; --accent: #ffd60a; --muted: #777; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  .sub { color: var(--muted); margin-top: 0; }
  ol.steps { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .4rem; }
  .step { padding: .35rem .7rem; border-radius: 999px; border: 1px solid #8886; color: var(--muted); }
  .step.done { border-color: #2e7d32; color: inherit; }
  .step.current { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 700; }
  .step.failed { background: #c0392b; color: #fff; border-color: #c0392b; }
  .warning { background: #fff3cd; color: #5c4400; padding: .6rem 1rem; border-radius: 8px; margin: .5rem 0; }
  .notice { color: #5c4400; background: #fff3cd; padding: .1rem .4rem; border-radius: 6px; }
  .error { background: #c0392b; color: #fff; padding: .75rem 1rem; border-radius: 8px; margin: 1rem 0; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; }
  dt { color: var(--muted); }
  pre { white-space: pre-wrap; background: #8881; padding: .75rem; border-radius: 8px; }
  a { color: inherit; }
  video { display: block; max-width: 270px; width: 100%; background: #000; border-radius: 8px; }
  img.sheet { display: block; max-width: 100%; height: auto; border-radius: 8px; }
  ul.checks { list-style: none; padding: 0; }
  .check { padding: .3rem .6rem; border-left: 4px solid #8886; margin: .25rem 0; }
  .check.pass { border-color: #2e7d32; }
  .check.fail { border-color: #c0392b; font-weight: 700; }
  .check.not_implemented { color: var(--muted); }
  table.ledger { border-collapse: collapse; width: 100%; font-size: .9rem; }
  table.ledger th, table.ledger td { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid #8884; }
  table.ledger tr.total th, table.ledger tr.total td { font-weight: 700; border-bottom: 0; }
  .average { color: var(--muted); }
  form.retry { margin: 1rem 0; }
  form.retry button { font: inherit; font-weight: 700; padding: .6rem 1.2rem; border: 0;
                      border-radius: 8px; background: var(--accent); color: #111; cursor: pointer; }
</style>
</head>
<body>
<h1>Job $job_id</h1>
<p class="sub">Status: <strong data-status>$status</strong><span data-position>$position</span> · Elapsed: <span data-elapsed>$elapsed</span></p>
<ol class="steps">
$steps
</ol>
$warnings
$error
<dl>
  <dt>Recording</dt><dd>$input_line</dd>
  <dt>Style</dt><dd>$style$style_notice</dd>
  <dt>Style note</dt><dd>$style_note</dd>
  <dt>References</dt><dd>$references</dd>
</dl>
$result
$ledger
<h2>Brief</h2>
<pre>$brief</pre>
<p><a href="/">Upload another</a> · <a href="/jobs">All jobs</a></p>
<script>
(function () {
  var url = "$json_url";
  var status = "$status";
  var position = $position_json;
  var createdAt = new Date("$created_at").getTime();
  function fmt(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + "m " + (s % 60) + "s";
  }
  function tick() {
    fetch(url, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (job) {
        if (job.status !== status || job.queue_position !== position) { location.reload(); return; }
        var end = $terminal ? new Date(job.updated_at).getTime() : Date.now();
        document.querySelector("[data-elapsed]").textContent = fmt(end - createdAt);
      })
      .catch(function () {});
  }
  setInterval(tick, $poll_ms);
})();
</script>
</body>
</html>
