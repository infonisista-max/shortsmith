<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortsmith</title>
<style>
  :root { color-scheme: light dark; --accent: #ffd60a; --muted: #777; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.6rem; margin-bottom: .25rem; }
  .sub { color: var(--muted); margin-top: 0; }
  fieldset { border: 1px solid #8884; border-radius: 8px; margin: 1rem 0; padding: 1rem; }
  legend { font-weight: 600; padding: 0 .4rem; }
  label { display: block; font-weight: 600; margin-top: .75rem; }
  input[type=text], textarea { width: 100%; box-sizing: border-box; padding: .5rem; font: inherit; }
  textarea { min-height: 9rem; }
  .hint { color: var(--muted); font-size: .9rem; margin: .25rem 0 0; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .4rem 0; }
  .chip { padding: .25rem .7rem; border-radius: 999px; border: 1px solid #8886; cursor: pointer;
          font-size: .9rem; user-select: none; }
  .chip:hover { border-color: var(--accent); }
  .resolution { font-size: .95rem; margin: .5rem 0 0; }
  .notice { color: #5c4400; background: #fff3cd; padding: .1rem .4rem; border-radius: 6px; }
  .ref { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; align-items: center; margin-top: .5rem; }
  .reject { background: #c0392b; color: #fff; padding: .75rem 1rem; border-radius: 8px; margin: 1rem 0; }
  .closed { background: #fff3cd; color: #5c4400; padding: .75rem 1rem; border-radius: 8px; margin: 1rem 0; }
  button { font: inherit; font-weight: 700; padding: .75rem 1.5rem; border: 0; border-radius: 8px;
           background: var(--accent); color: #111; cursor: pointer; }
</style>
</head>
<body>
<h1>Shortsmith</h1>
<p class="sub">A raw recording, a short brief and a style word in; a finished 9:16 Short out. <a href="/jobs">Your jobs</a></p>
$rejection
$body
</body>
</html>
