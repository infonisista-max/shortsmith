# Stickers (ticket 062): 3D emoji from Microsoft Fluent Emoji, MIT License,
# "Copyright (c) Microsoft Corporation" (https://github.com/microsoft/fluentui-emoji).
# `name` is the Fluent folder name, the one word the planner may write besides a tag;
# `path` sits under that repository's `assets/` folder; `tags` are the intents the
# planner picks by (a tag's first row is its default). The PNGs are fetched on first
# use into the git-ignored cache `<data dir>/cache/stickers/`, never committed. Every path below was
# checked live (HTTP 200) on 28 Sep 2026. Validated at startup by
# `shortsmith.stickers.load_catalogue`.
entries:
