# Effect map (ticket 077): how a worked example shows an effect the renderer cannot draw.
# A reference card names such an effect `unregistered` and keeps the model's own name for
# it; this file maps that name to the closest registered component (docs/components.md),
# or to null: "(no equivalent: skip)". A name missing here is skipped the same way.
# Loaded by `shortsmith.reference.examples.load_effect_map`; a target that is not a
# registered component is refused naming both. Seeded from every `unregistered` name in
# docs/reference/inventory/*.json (29 Sep 2026); the agent's picks, for the operator to
# overrule.
